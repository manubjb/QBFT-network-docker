services:
  node1:
    image: hyperledger/besu:26.6.0
    container_name: qbft-node1
    volumes:
      - ./nodes/node-1/data:/data
      - ./genesis.json:/genesis.json
    command:
      - --data-path=/data
      - --genesis-file=/genesis.json
      - --node-private-key-file=/data/key
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,QBFT
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --nat-method=DOCKER
      - --p2p-port=30303
    ports:
      - "8545:8545"
    networks:
      qbft:
        ipv4_address: 172.30.0.11

  node2:
    image: hyperledger/besu:26.6.0
    container_name: qbft-node2
    depends_on:
      - node1
    volumes:
      - ./nodes/node-2/data:/data
      - ./genesis.json:/genesis.json
    command:
      - --data-path=/data
      - --genesis-file=/genesis.json
      - --node-private-key-file=/data/key
      - --bootnodes=enode://${BOOTNODE_PUBLIC_KEY}@172.30.0.11:30303
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,QBFT
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --nat-method=DOCKER
      - --p2p-port=30303
    networks:
      qbft:
        ipv4_address: 172.30.0.12

  node3:
    image: hyperledger/besu:26.6.0
    container_name: qbft-node3
    depends_on:
      - node1
    volumes:
      - ./nodes/node-3/data:/data
      - ./genesis.json:/genesis.json
    command:
      - --data-path=/data
      - --genesis-file=/genesis.json
      - --node-private-key-file=/data/key
      - --bootnodes=enode://${BOOTNODE_PUBLIC_KEY}@172.30.0.11:30303
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,QBFT
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --nat-method=DOCKER
      - --p2p-port=30303
    networks:
      qbft:
        ipv4_address: 172.30.0.13

  node4:
    image: hyperledger/besu:26.6.0
    container_name: qbft-node4
    depends_on:
      - node1
    volumes:
      - ./nodes/node-4/data:/data
      - ./genesis.json:/genesis.json
    command:
      - --data-path=/data
      - --genesis-file=/genesis.json
      - --node-private-key-file=/data/key
      - --bootnodes=enode://${BOOTNODE_PUBLIC_KEY}@172.30.0.11:30303
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,QBFT
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --nat-method=DOCKER
      - --p2p-port=30303
    networks:
      qbft:
        ipv4_address: 172.30.0.14

  rpcnode:
    image: hyperledger/besu:26.6.0
    container_name: qbft-rpcnode
    depends_on:
      - node1
    volumes:
      - ./nodes/rpcnode/data:/data
      - ./genesis.json:/genesis.json
    command:
      - --data-path=/data
      - --genesis-file=/genesis.json
      - --bootnodes=enode://${BOOTNODE_PUBLIC_KEY}@172.30.0.11:30303
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --rpc-ws-enabled
      - --rpc-ws-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --nat-method=DOCKER
      - --p2p-port=30303
    ports:
      - "8555:8545"
      - "8556:8546"
    networks:
      qbft:
        ipv4_address: 172.30.0.15

networks:
  qbft:
    ipam:
      config:
        - subnet: 172.30.0.0/24
